  <line x1="673" y1="265" x2="700" y2="158" stroke="#b07020" stroke-width="3"/>
  <path d="M700,158 L694,169 M700,158 L707,169" stroke="#b07020" stroke-width="3" fill="none"/>
  <circle cx="678" cy="210" r="12" fill="#b07020"/><text x="678" y="214" font-size="13" font-weight="700" fill="#fff" text-anchor="middle">⑤</text>

