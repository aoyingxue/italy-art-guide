    <text x="115" y="677" fill="#111111">Ortisei → Alpe di Siusi 1,700 m</text>
    <text x="380" y="677" fill="#111111">€30 往返</text>
    <text x="480" y="677" fill="#111111">4/30 - 11/1</text>
    <text x="680" y="677" fill="#2a6b3a" font-weight="700">开放 ✓</text>
  </g>
  <line x1="40" y1="688" x2="880" y2="688" stroke="#cccccc" stroke-width="0.5"/>

  <!-- Row 3: Resciesa -->
  <g font-size="10">
    <circle cx="63" cy="706" r="12" fill="#b07020"/><text x="63" y="710" font-size="13" font-weight="700" fill="#fff" text-anchor="middle">③</text>
    <text x="85" y="710" fill="#111111" font-weight="600">Resciesa</text>
    <text x="115" y="710" fill="#111111">Ortisei → Resciesa 2,280 m</text>
    <text x="380" y="710" fill="#111111">~€20 往返</text>
    <text x="480" y="710" fill="#111111">5/15 - 10/10</text>
    <text x="680" y="710" fill="#b07020" font-weight="700">10/10 止 ⚠</text>
  </g>
  <line x1="40" y1="721" x2="880" y2="721" stroke="#cccccc" stroke-width="0.5"/>

  <!-- Row 4: Col Raiser -->
  <g font-size="10">
    <circle cx="63" cy="739" r="12" fill="#b07020"/><text x="63" y="743" font-size="13" font-weight="700" fill="#fff" text-anchor="middle">④</text>
    <text x="85" y="743" fill="#111111" font-weight="600">Col Raiser</text>
    <text x="115" y="743" fill="#111111">S. Cristina → Col Raiser 2,107 m</text>
    <text x="380" y="743" fill="#111111">~€30 往返</text>
    <text x="480" y="743" fill="#111111">5/21 - 10/31</text>
    <text x="680" y="743" fill="#b07020" font-weight="700">10/31 止 ⚠</text>
  </g>
  <line x1="40" y1="754" x2="880" y2="754" stroke="#cccccc" stroke-width="0.5"/>

  <!-- Row 5: Ciampinoi -->
  <g font-size="10">
    <circle cx="63" cy="772" r="12" fill="#b07020"/><text x="63" y="776" font-size="13" font-weight="700" fill="#fff" text-anchor="middle">⑤</text>
    <text x="85" y="776" fill="#111111" font-weight="600">Ciampinoi</text>
    <text x="115" y="776" fill="#111111">Selva → Ciampinoi 2,254 m</text>
    <text x="380" y="776" fill="#111111">~€30 往返</text>
    <text x="480" y="776" fill="#111111">6/5 - 10/10</text>
    <text x="680" y="776" fill="#b07020" font-weight="700">10/10 止 ⚠</text>
  </g>
  <line x1="40" y1="787" x2="880" y2="787" stroke="#cccccc" stroke-width="0.5"/>

  <!-- Row 6: Dantercepies -->
  <g font-size="10" opacity="0.6">
    <circle cx="63" cy="805" r="12" fill="#b33a2e"/><text x="63" y="809" font-size="13" font-weight="700" fill="#fff" text-anchor="middle">⑥</text>
    <text x="85" y="809" fill="#555555" font-weight="600">Dantercepies</text>
    <text x="115" y="809" fill="#555555">Selva → Passo Gardena</text>
    <text x="380" y="809" fill="#555555">—</text>
    <text x="480" y="809" fill="#555555">6/11 - 10/3</text>
    <text x="680" y="809" fill="#b33a2e" font-weight="700">已停 ✗</text>
  </g>
  <line x1="40" y1="820" x2="880" y2="820" stroke="#cccccc" stroke-width="0.5"/>

  <!-- Row 7: Monte Pana -->
  <g font-size="10" opacity="0.6">
    <circle cx="63" cy="838" r="12" fill="#b33a2e"/><text x="63" y="842" font-size="13" font-weight="700" fill="#fff" text-anchor="middle">⑦</text>
    <text x="85" y="842" fill="#555555" font-weight="600">Monte Pana</text>
    <text x="115" y="842" fill="#555555">S. Cristina → Monte Pana</text>
    <text x="380" y="842" fill="#555555">—</text>
    <text x="480" y="842" fill="#555555">6/5 - 9/26</text>
    <text x="680" y="842" fill="#b33a2e" font-weight="700">已停 ✗</text>
  </g>

  <!-- ===== 底部提示 ===== -->
  <g transform="translate(40,870)">
    <rect x="0" y="0" width="840" height="30" rx="4" fill="none" stroke="#2a6b3a" stroke-width="1"/>
    <text x="420" y="14" font-size="10" fill="#2a6b3a" font-weight="600" text-anchor="middle">Val Gardena Card（3 天 / 6 天）：所有开放缆车无限次乘坐，连续 2 天以上通常比单次票划算</text>
    <text x="420" y="26" font-size="9" fill="#999999" text-anchor="middle">数据来源：val-gardena.net（2026 年缆车时刻表）· 示意图非精确比例 · 出发前请查 val-gardena.net/lifts</text>
  </g>
</svg>