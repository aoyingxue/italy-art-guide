    <text x="380" y="615">票价</text>
    <text x="480" y="615">2026 运营季</text>
    <text x="680" y="615">10 月状态</text>
  </g>
  <line x1="40" y1="622" x2="880" y2="622" stroke="#555555" stroke-width="1"/>

