  <!-- Row 1: Seceda -->
  <g font-size="10">
    <circle cx="63" cy="640" r="12" fill="#2a6b3a"/><text x="63" y="644" font-size="13" font-weight="700" fill="#fff" text-anchor="middle">①</text>
    <text x="85" y="644" fill="#111111" font-weight="600">Furnes-Seceda</text>
    <text x="115" y="644" fill="#111111">Ortisei → Furnes → Seceda 2,519 m</text>
    <text x="380" y="644" fill="#111111">€35 往返</text>
    <text x="480" y="644" fill="#111111">5/21 - 11/1</text>
    <text x="680" y="644" fill="#2a6b3a" font-weight="700">开放 ✓</text>
  </g>
  <line x1="40" y1="655" x2="880" y2="655" stroke="#cccccc" stroke-width="0.5"/>

