  <line x1="512" y1="313" x2="545" y2="307" stroke="#b33a2e" stroke-width="2" stroke-dasharray="6,4"/>
  <circle cx="530" cy="310" r="12" fill="#b33a2e"/><text x="530" y="314" font-size="13" font-weight="700" fill="#fff" text-anchor="middle">⑦</text>

  <!-- Alpe di Siusi 区域 -->
  <rect x="270" y="400" width="280" height="120" rx="10" fill="none" stroke="#cccccc" stroke-width="1.5" stroke-dasharray="6,4"/>
  <g text-anchor="middle">
    <text x="410" y="424" font-size="13" font-weight="700" fill="#111111" font-family="'Palatino Linotype',Palatino,Georgia,'Songti SC',SimSun,serif">Alpe di Siusi 休斯高原</text>
    <text x="410" y="441" font-size="9" fill="#555555">Seiser Alm · 1,700-2,400 m</text>
    <text x="410" y="457" font-size="9" fill="#555555">欧洲最大高山草甸（56 km²）· 草甸内禁车</text>
  </g>
  <g>
    <rect x="500" y="448" width="80" height="18" rx="4" fill="none" stroke="#999999" stroke-width="1"/>
    <text x="540" y="461" font-size="9" fill="#999999" text-anchor="middle">Compatsch 停车场</text>
