  <!-- 山谷公路 + Bus 350 -->
  <line x1="40" y1="312" x2="830" y2="275" stroke="#cccccc" stroke-width="3"/>
  <line x1="40" y1="312" x2="830" y2="275" stroke="#888888" stroke-width="1.5" stroke-dasharray="8,5"/>
  <text x="95" y="302" font-size="9" fill="#888888" font-weight="600">Bus 350 · Bolzano ↔ Selva</text>
  <path d="M30,312 L45,312 M45,312 L38,308 M45,312 L38,316" stroke="#888888" stroke-width="1.5" fill="none"/>
  <text x="28" y="332" font-size="9" fill="#888888">← Bolzano</text>

