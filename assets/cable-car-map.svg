  <!-- ① Ortisei → Furnes → Seceda -->
  <line x1="262" y1="297" x2="308" y2="225" stroke="#2a6b3a" stroke-width="3"/>
  <circle cx="308" cy="225" r="3" fill="#2a6b3a"/>
  <line x1="308" y1="225" x2="350" y2="162" stroke="#2a6b3a" stroke-width="3"/>
  <path d="M350,162 L344,173 M350,162 L357,173" stroke="#2a6b3a" stroke-width="3" fill="none"/>
  <circle cx="295" cy="238" r="12" fill="#2a6b3a"/><text x="295" y="242" font-size="13" font-weight="700" fill="#fff" text-anchor="middle">①</text>

  <!-- ② Ortisei → Alpe di Siusi -->
  <line x1="278" y1="325" x2="298" y2="400" stroke="#2a6b3a" stroke-width="3"/>
  <path d="M298,400 L292,390 M298,400 L305,390" stroke="#2a6b3a" stroke-width="3" fill="none"/>
  <circle cx="283" cy="362" r="12" fill="#2a6b3a"/><text x="283" y="366" font-size="13" font-weight="700" fill="#fff" text-anchor="middle">②</text>

