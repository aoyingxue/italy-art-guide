<svg viewBox="0 0 920 920" xmlns="http://www.w3.org/2000/svg" style="font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif;background:#ffffff;">
  <!-- 标题 -->
  <text x="460" y="28" font-size="18" font-weight="700" fill="#111111" text-anchor="middle" font-family="'Palatino Linotype',Palatino,Georgia,'Songti SC',SimSun,serif">Val Gardena 缆车路线图</text>
  <text x="460" y="46" font-size="10" fill="#999999" text-anchor="middle" letter-spacing="2">CABLE CAR NETWORK · VAL GARDENA</text>

  <!-- 指北针 -->
  <g transform="translate(870,55)">
    <path d="M0,16 L0,-12 M0,-12 L-5,-3 M0,-12 L5,-3" stroke="#999999" stroke-width="1.5" fill="none"/>
    <text y="32" font-size="11" fill="#999999" text-anchor="middle">N</text>
  </g>

  <!-- 山体背景（Odles 群） -->
  <path d="M120,150 L180,100 L240,120 L310,80 L380,110 L450,90 L520,120 L580,100 L650,120 L720,90 L790,110 L850,95"
        fill="none" stroke="#cccccc" stroke-width="1.5" stroke-dasharray="4,3"/>
  <text x="420" y="88" font-size="9" fill="#999999" text-anchor="middle" letter-spacing="1">ODELES / GEISLER</text>

  <!-- 山顶（只写名称和海拔，不写运营状态） -->
  <g text-anchor="middle">
    <!-- Resciesa -->
    <path d="M170,195 L188,172 L206,195 Z" fill="none" stroke="#111111" stroke-width="1.5"/>
    <text x="188" y="167" font-size="12" font-weight="700" fill="#111111">Resciesa</text>
    <text x="188" y="210" font-size="9" fill="#555555">2,280 m</text>

    <!-- Seceda -->
    <path d="M330,162 L350,138 L370,162 Z" fill="none" stroke="#111111" stroke-width="1.5"/>
    <text x="350" y="133" font-size="13" font-weight="700" fill="#111111">Seceda</text>
    <text x="350" y="177" font-size="9" fill="#555555">2,519 m</text>

    <!-- Col Raiser -->
    <path d="M500,172 L518,150 L536,172 Z" fill="none" stroke="#111111" stroke-width="1.5"/>
    <text x="518" y="145" font-size="12" font-weight="700" fill="#111111">Col Raiser</text>
    <text x="518" y="187" font-size="9" fill="#555555">2,107 m</text>

    <!-- Ciampinoi -->
    <path d="M680,155 L700,132 L720,155 Z" fill="none" stroke="#111111" stroke-width="1.5"/>
    <text x="700" y="127" font-size="12" font-weight="700" fill="#111111">Ciampinoi</text>
    <text x="700" y="170" font-size="9" fill="#555555">2,254 m</text>

    <!-- Dantercepies -->
    <circle cx="790" cy="162" r="4" fill="none" stroke="#111111" stroke-width="1.5"/>
    <text x="790" y="152" font-size="11" font-weight="600" fill="#555555">Dantercepies</text>

    <!-- Passo Gardena -->
    <path d="M835,195 L852,175 L869,195 Z" fill="none" stroke="#999999" stroke-width="1.5"/>
    <text x="852" y="170" font-size="11" font-weight="600" fill="#111111">Passo Gardena</text>
    <text x="852" y="210" font-size="9" fill="#555555">2,121 m · 自驾</text>

    <!-- Monte Pana -->
    <circle cx="545" cy="302" r="4" fill="none" stroke="#999999" stroke-width="1.5"/>
    <text x="545" y="293" font-size="11" font-weight="600" fill="#555555">Monte Pana</text>
