  <line x1="698" y1="265" x2="790" y2="167" stroke="#b33a2e" stroke-width="2" stroke-dasharray="6,4"/>
  <circle cx="738" cy="210" r="12" fill="#b33a2e"/><text x="738" y="214" font-size="13" font-weight="700" fill="#fff" text-anchor="middle">⑥</text>

