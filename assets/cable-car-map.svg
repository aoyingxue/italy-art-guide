  <line x1="248" y1="297" x2="188" y2="200" stroke="#b07020" stroke-width="3"/>
  <path d="M188,200 L182,211 M188,200 L195,211" stroke="#b07020" stroke-width="3" fill="none"/>
  <circle cx="213" cy="245" r="12" fill="#b07020"/><text x="213" y="249" font-size="13" font-weight="700" fill="#fff" text-anchor="middle">③</text>

  <!-- ④ S.Cristina → Col Raiser -->
  <line x1="488" y1="285" x2="520" y2="175" stroke="#b07020" stroke-width="3"/>
  <path d="M520,175 L514,186 M520,175 L527,186" stroke="#b07020" stroke-width="3" fill="none"/>
  <circle cx="498" cy="228" r="12" fill="#b07020"/><text x="498" y="232" font-size="13" font-weight="700" fill="#fff" text-anchor="middle">④</text>

