    <line x1="868" y1="265" x2="900" y2="255" stroke="#999999" stroke-width="1" stroke-dasharray="4,3"/>
    <text x="885" y="250" text-anchor="middle">Braies 湖</text>
    <text x="885" y="262" text-anchor="middle">自驾 1h</text>
  </g>

  <!-- ===== 分隔线 ===== -->
  <line x1="40" y1="565" x2="880" y2="565" stroke="#cccccc" stroke-width="1"/>

  <!-- ===== 图例标题 ===== -->
